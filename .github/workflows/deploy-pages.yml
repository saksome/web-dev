name: Deploy Web Designing Lab pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static experiments
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for n in 1 2 3 4 5 6; do
            mkdir -p "_site/experiment-$n"
            cp -a "Experiment $n/." "_site/experiment-$n/"
          done
          touch _site/.nojekyll

      - name: Install and build React notes app
        working-directory: Experiment 7
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/web-dev/experiment-7/

      - name: Add React app to site
        run: |
          mkdir -p _site/experiment-7
          cp -a "Experiment 7/dist/." "_site/experiment-7/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
